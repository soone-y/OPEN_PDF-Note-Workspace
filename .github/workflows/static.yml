# 公開snapshot内のAI向け文書を GitHub Pages (静的 HTML) で公開する
# ベース: GitHub 公式 "Deploy static content to Pages" テンプレート
name: Deploy documentation portal to GitHub Pages

on:
  push:
    # main ブランチへの push のうち、公開対象ファイルが変更された場合のみ実行
    branches: ["main"]
    paths:
      - "for_ai/**"
      - "For_AI.md"
      - "llms.txt"
      - "README.md"
      - "LICENSE.md"
      - "LICENSES_INDEX.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/SECURITY.md"
      - "docs/public/**"
      - "docs/images/**"
      - "REPO_VERSION.txt"
      - "site/github/**"
      - ".github/workflows/static.yml"

  # Actions タブから手動実行できるようにする
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは 1 件のみ許可。進行中のデプロイはキャンセルしない
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 公開snapshot内の正本から文書ポータルを生成する。紹介ページは使わない。
      - name: Build documentation portal
        run: python3 site/github/scripts/build_public_site.py --replace --documentation-portal

      - name: Validate selected documentation site
        run: python3 site/github/scripts/validate_public_site.py --site site/github/output/public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ソース全体ではなく公開成果物だけをアップロード
          path: 'site/github/output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
